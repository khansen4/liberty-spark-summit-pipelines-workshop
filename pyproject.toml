[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liberty-claims-demo-spark-summit"
version = "0.1.0"
description = "Liberty Mutual claims processing — code quality teaching demo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
